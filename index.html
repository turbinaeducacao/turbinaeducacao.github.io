<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbina Educação · Em breve</title>
<meta name="description" content="A Turbina Educação está em construção. Em breve, novidades para quem vende educação.">
<meta property="og:title" content="Turbina Educação · Em breve">
<meta property="og:description" content="Mais potência para quem vende educação. Em breve, novidades.">
<meta name="theme-color" content="#052E1F">
<link rel="icon" type="image/png" href="favicon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(Bricolage-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Inter";src:url(Inter-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(JetBrainsMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--esm:#052E1F;--esm2:#0A4630;--apoio:#0F5C3E;--neon:#00F57A;--claro:#EFFFF6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--esm);color:var(--claro);font-family:"Inter",system-ui,sans-serif;font-weight:500;
 min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;position:relative;
 background:radial-gradient(circle at 100% 0%,var(--esm2) 0%,var(--esm) 65%)}
.tex{position:fixed;right:-18vmin;top:-18vmin;width:72vmin;opacity:.06;pointer-events:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px 32px;position:relative}
.logo{width:150px;height:auto;margin-bottom:44px}
.over{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.22em;color:var(--neon);margin:0 0 22px;
 display:inline-flex;align-items:center;gap:10px}
.over::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neon);animation:p 1.8s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(34px,6.4vw,64px);line-height:1.08;letter-spacing:-.015em;margin:0;max-width:18ch}
mark{background:var(--neon);color:var(--esm);padding:0 .14em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p.lead{font-size:clamp(16px,2.1vw,19px);line-height:1.55;max-width:34em;margin:26px 0 0;opacity:.86}
.contato{margin-top:40px;font-size:15px;opacity:.86}
.contato a{color:var(--claro);text-decoration:none;border-bottom:1px solid var(--neon);padding-bottom:2px}
.contato a:hover{color:var(--neon)}
footer{position:relative;text-align:center;padding:24px 20px 28px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.12em;opacity:.55}
@media (prefers-reduced-motion:reduce){.over::before{animation:none}}
</style>
</head>
<body>
<img class="tex" src="simbolo.svg" alt="">
<main>
  <img class="logo" src="logo-vertical.svg" alt="Turbina Educação">
  <p class="over">EM CONSTRUÇÃO</p>
  <h1>Mais <mark>potência</mark> para quem vende educação.</h1>
  <p class="lead">Estamos preparando a Turbina Educação. Em breve, novidades para polos de apoio presencial e instituições de ensino.</p>
  <p class="contato">Quer conversar? <a href="mailto:contato@turbinaeducacao.com.br">contato@turbinaeducacao.com.br</a></p>
</main>
<footer>© 2026 TURBINA EDUCAÇÃO</footer>
</body>
</html>
